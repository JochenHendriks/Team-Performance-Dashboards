<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=Dashboard%20V12.html">
    <title>Team Performance Dashboards</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #091e42;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            color: #172b4d;
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 12px 32px rgba(0,0,0,0.25);
            text-align: center;
        }
        h1 {
            font-size: 1.6rem;
            margin-top: 0;
            color: #0052cc;
        }
        p {
            font-size: 1rem;
            color: #5e6c84;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: inline-block;
            background: #0052cc;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #0747a6;
        }
        .btn.secondary {
            background: #ebecf0;
            color: #172b4d;
        }
        .btn.secondary:hover {
            background: #dfe1e6;
        }
    </style>
    <script>
        window.location.replace("Dashboard V12.html");
    </script>
</head>
<body>
    <div class="card">
        <h1>Team Performance Dashboards</h1>
        <p>Je wordt doorgestuurd naar het DORA &amp; Performance Dashboard. Klik hieronder indien dit niet automatisch gebeurt:</p>
        <div class="links">
            <a class="btn" href="Dashboard V12.html">🚀 Open DORA &amp; Performance Dashboard V12</a>
            <a class="btn secondary" href="EBM dashboard.html">📊 Open EBM Dashboard (Cycle Time &amp; Sprints)</a>
        </div>
    </div>
</body>
</html>
