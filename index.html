<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=dora/">
    <title>DORA &amp; Performance Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #091e42;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            color: #172b4d;
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 540px;
            width: 100%;
            box-shadow: 0 12px 32px rgba(0,0,0,0.25);
            text-align: center;
        }
        h1 {
            font-size: 1.6rem;
            margin-top: 0;
            color: #0052cc;
        }
        p {
            font-size: 0.95rem;
            color: #5e6c84;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            background: #0052cc;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #0747a6;
        }
    </style>
    <script>
        window.location.replace("dora/");
    </script>
</head>
<body>
    <div class="card">
        <h1>DORA &amp; Performance Dashboard</h1>
        <p>Je wordt automatisch doorgestuurd naar het DORA Dashboard. Klik hieronder indien dit niet direct gebeurt:</p>
        <a class="btn" href="dora/">🚀 Open DORA Dashboard</a>
    </div>
</body>
</html>
